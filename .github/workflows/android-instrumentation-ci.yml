name: Android Instrumentation CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  android-instrumentation:
    name: android-instrumentation-ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 1800
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -accel off
          script: bash scripts/ci/run_android_instrumentation.sh

      - name: Sanitize instrumentation diagnostics and enforce test gate
        if: always()
        run: >-
          python scripts/ci/sanitize_junit.py
          --input-dir android/app/build/outputs/androidTest-results/connected
          --output "$RUNNER_TEMP/android-instrumentation-safe/android-instrumentation-junit.xml"
          --summary "$RUNNER_TEMP/android-instrumentation-safe/summary.json"

      - name: Upload privacy-safe instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumentation-diagnostics
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/android-instrumentation-safe/android-instrumentation-junit.xml
            ${{ runner.temp }}/android-instrumentation-safe/summary.json
