name: Android Instrumentation CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  android-instrumentation:
    name: android-instrumentation-ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 1800
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -accel off
          script: |
            set -euo pipefail
            fixture_path=/sdcard/DCIM/LifeTimelineTest/synthetic-photo.jpg
            adb shell mkdir -p /sdcard/DCIM/LifeTimelineTest
            adb push android/app/src/androidTest/assets/synthetic-photo.jpg "$fixture_path"
            adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d "file://$fixture_path"
            indexed=false
            for attempt in $(seq 1 30); do
              if adb shell content query --uri content://media/external/images/media --projection _id --where "display_name='synthetic-photo.jpg'" | grep -q '_id='; then
                indexed=true
                break
              fi
              sleep 1
            done
            if [ "$indexed" != true ]; then
              echo "Synthetic MediaStore image was not indexed."
              exit 1
            fi
            ./android/gradlew --no-daemon -p android connectedDebugAndroidTest

      - name: Sanitize instrumentation diagnostics and enforce test gate
        if: always()
        run: >-
          python scripts/ci/sanitize_junit.py
          --input-dir android/app/build/outputs/androidTest-results/connected
          --output "$RUNNER_TEMP/android-instrumentation-safe/android-instrumentation-junit.xml"
          --summary "$RUNNER_TEMP/android-instrumentation-safe/summary.json"

      - name: Upload privacy-safe instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumentation-diagnostics
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/android-instrumentation-safe/android-instrumentation-junit.xml
            ${{ runner.temp }}/android-instrumentation-safe/summary.json
