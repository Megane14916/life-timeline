name: Android Instrumentation CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  android-instrumentation:
    name: android-instrumentation-ci
    runs-on: macos-13
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          script: |
            set -euo pipefail
            adb wait-for-device
            for attempt in $(seq 1 120); do
              boot_completed=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              package_service=$(adb shell service check package 2>/dev/null || true)
              if [ "$boot_completed" = "1" ] && printf '%s' "$package_service" | grep -q 'found'; then
                break
              fi
              if [ "$attempt" -eq 120 ]; then
                echo "Android package service did not become ready."
                exit 1
              fi
              sleep 5
            done
            set +e
            ./android/gradlew --no-daemon -p android connectedDebugAndroidTest
            test_status=$?
            mkdir -p android-instrumentation-artifacts
            adb logcat -d > android-instrumentation-artifacts/logcat.txt
            exit $test_status

      - name: Verify instrumentation test results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result_directory="android/app/build/outputs/androidTest-results/connected"
          if [ ! -d "$result_directory" ]; then
            echo "Instrumentation result directory is missing."
            exit 1
          fi
          result_files=$(find "$result_directory" -type f -name 'TEST-*.xml' -print)
          if [ -z "$result_files" ]; then
            echo "No instrumentation JUnit result files were produced."
            exit 1
          fi
          if ! grep -R -E 'tests="[1-9][0-9]*"' "$result_directory"; then
            echo "Instrumentation produced zero executed tests."
            exit 1
          fi

      - name: Upload instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumentation-diagnostics
          if-no-files-found: warn
          path: |
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/
            android-instrumentation-artifacts/
