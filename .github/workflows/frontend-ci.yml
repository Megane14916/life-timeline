name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: frontend-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Sanitize test diagnostics and enforce test gate
        if: always()
        run: >-
          python ../scripts/ci/sanitize_junit.py
          --input vitest-junit.xml
          --output "$RUNNER_TEMP/frontend-ci-safe/frontend-junit.xml"
          --summary "$RUNNER_TEMP/frontend-ci-safe/summary.json"

      - name: Upload privacy-safe test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-junit
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/frontend-ci-safe/frontend-junit.xml
            ${{ runner.temp }}/frontend-ci-safe/summary.json

      - name: Build
        run: npm run build
