name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-ubuntu:
    name: backend-ci (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.9
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy app tests

      - name: Test
        run: uv run pytest --junitxml "$RUNNER_TEMP/backend-tests-raw.xml"

      - name: Sanitize test diagnostics and enforce test gate
        if: always()
        run: >-
          uv run python ../scripts/ci/sanitize_junit.py
          --input "$RUNNER_TEMP/backend-tests-raw.xml"
          --output "$RUNNER_TEMP/backend-ci-safe/backend-junit.xml"
          --summary "$RUNNER_TEMP/backend-ci-safe/summary.json"

      - name: Upload privacy-safe test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-junit-ubuntu
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/backend-ci-safe/backend-junit.xml
            ${{ runner.temp }}/backend-ci-safe/summary.json

      - name: Check migration heads
        run: uv run alembic heads

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Run HTTP smoke test
        run: uv run python scripts/smoke.py

  backend-windows:
    name: backend-ci (windows)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.9
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy app tests

      - name: Test
        run: uv run pytest --junitxml "$env:RUNNER_TEMP\backend-tests-raw.xml"

      - name: Sanitize test diagnostics and enforce test gate
        if: always()
        run: >-
          uv run python ..\scripts\ci\sanitize_junit.py
          --input "$env:RUNNER_TEMP\backend-tests-raw.xml"
          --output "$env:RUNNER_TEMP\backend-ci-safe\backend-junit.xml"
          --summary "$env:RUNNER_TEMP\backend-ci-safe\summary.json"

      - name: Upload privacy-safe test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-junit-windows
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/backend-ci-safe/backend-junit.xml
            ${{ runner.temp }}/backend-ci-safe/summary.json

      - name: Check migration heads
        run: uv run alembic heads

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Run HTTP smoke test
        run: ./scripts/smoke.ps1
