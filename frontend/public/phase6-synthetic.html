<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Life Timeline Phase 6 Synthetic Page</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f4f1ea;
        color: #22201d;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(38rem, calc(100% - 2rem));
        padding: 2rem;
        border: 1px solid #d8d0c1;
        border-radius: 1rem;
        background: #fffdf8;
        box-shadow: 0 1rem 3rem rgb(34 32 29 / 10%);
      }

      h1 {
        margin-top: 0;
      }

      code {
        padding: 0.15rem 0.35rem;
        border-radius: 0.25rem;
        background: #eee8dc;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Phase 6 Synthetic Activity Page</h1>
      <p>
        This localhost-only page is for ActivityWatch Web watcher acceptance.
      </p>
      <p>Use it with a query and fragment when verifying URL minimization.</p>
      <p>
        <code>query</code> and <code>fragment</code> must not be retained by
        life-timeline.
      </p>
    </main>
  </body>
</html>
